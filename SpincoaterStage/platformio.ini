[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
monitor_speed = 115200
; ODriveUART library kept ONLY for Serial1 initialization side-effect
; on RP2040 mbed — the ODriveUART global constructor triggers UART HW
; init that Serial1.begin() alone doesn't complete.  No library methods
; are called; all ODrive comms are raw ASCII.
lib_deps =
    https://github.com/odriverobotics/ODriveArduino.git#master
