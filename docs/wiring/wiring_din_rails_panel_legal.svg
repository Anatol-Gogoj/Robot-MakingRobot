path,line{fill:none;stroke-linecap:butt;stroke-linejoin:miter}
.ac{stroke:#CC3311;stroke-width:.6}
.va{stroke:#0077BB;stroke-width:.5}
.ve{stroke:#EE3377;stroke-width:.5}
