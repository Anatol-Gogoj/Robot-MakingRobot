<rect class="bx" x="256" y="186" width="92" height="21.5"/>
<text x="8" y="11.2" font-size="4.2" font-weight="bold">RMR control panel: operator panel</text>
<text x="8" y="15.4" font-size="2.1">Sheet 2D: how the operator panel might look from the front, at 1:1.5 with assumed sizes, and what each control wires to. The dashed bank beside it is a future feature.</text>
<text x="50.33" y="59.33" font-size="1.7" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">RMR Touch</text>
<text x="167" y="59.13" font-size="1.3" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Connected</text>
<text x="122.33" y="59.33" font-size="1.2" style="fill:#BBCCEE" text-anchor="middle">X 385.00  Y 120.00  Z 10.00</text>
<text x="46.24" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Jog</text>
<text x="67.38" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Recipe</text>
<text x="88.52" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Log</text>
<text x="109.67" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Spin</text>
<text x="130.81" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Console</text>
<text x="151.95" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Program</text>
<text x="173.1" y="67.4" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle">Advanced</text>
<text x="77" y="86.67" font-size="1.7" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Y+</text>
<text x="77" y="120" font-size="1.7" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Y-</text>
<text x="60.33" y="103.33" font-size="1.7" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">X-</text>
<text x="93.67" y="103.33" font-size="1.7" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">X+</text>
<text x="77" y="101.33" font-size="1.25" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">HOME</text>
<text x="77" y="102.9" font-size="1.06" style="fill:#FFFFFF" text-anchor="middle">ALL</text>
<text x="135.67" y="89.33" font-size="1.4" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Z up</text>
<text x="135.67" y="110" font-size="1.4" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">Z down</text>
<text x="165" y="85.67" font-size="1.2" style="fill:#DDDDDD" text-anchor="middle">Step  1 mm</text>
<text x="165" y="99.67" font-size="1.2" style="fill:#DDDDDD" text-anchor="middle">Feed  3000 mm/min</text>
<text x="165" y="113.67" font-size="1.2" style="fill:#DDDDDD" text-anchor="middle">A  B  C axes</text>
<text x="109.67" y="163" font-size="1.5" style="fill:#000" text-anchor="middle">10.1 in HDMI touch screen, Pi 5 behind it (Touch UI, Jog tab)</text>
<text x="224.67" y="58.33" font-size="1.15" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">EMERGENCY</text>
<text x="224.67" y="66" font-size="1.15" style="fill:#FFFFFF" text-anchor="middle" font-weight="bold">STOP</text>
<text x="224.67" y="88.33" font-size="1.45" style="fill:#000" text-anchor="middle" font-weight="bold">S2  E-STOP</text>
<text x="224.67" y="90.15" font-size="1.23" style="fill:#000" text-anchor="middle">push to stop, twist to release</text>
<text x="224.67" y="125.67" font-size="1.45" style="fill:#000" text-anchor="middle" font-weight="bold">S3  RESET</text>
<text x="224.67" y="127.48" font-size="1.23" style="fill:#000" text-anchor="middle">starts the motors after an E-stop</text>
<text x="211.33" y="140.33" font-size="1.4" style="fill:#000" text-anchor="middle" font-weight="bold">0</text>
<text x="238" y="140.33" font-size="1.4" style="fill:#000" text-anchor="middle" font-weight="bold">I</text>
<text x="224.67" y="161" font-size="1.45" style="fill:#000" text-anchor="middle" font-weight="bold">S1  POWER, H1 lamp</text>
<text x="224.67" y="162.81" font-size="1.23" style="fill:#000" text-anchor="middle">on: K1 in, lamp lit</text>
<text x="301.33" y="71.67" font-size="1.3" style="fill:#555555" text-anchor="middle" font-weight="bold">HOME ALL</text>
<text x="301.33" y="73.29" font-size="1.1" style="fill:#555555" text-anchor="middle">GPIO 22: G28, then M118 RMR:HOMED_ALL</text>
<text x="301.33" y="101" font-size="1.3" style="fill:#555555" text-anchor="middle" font-weight="bold">UV OFF</text>
<text x="301.33" y="102.62" font-size="1.1" style="fill:#555555" text-anchor="middle">GPIO 23: M42 P4 S0</text>
<text x="301.33" y="130.33" font-size="1.3" style="fill:#555555" text-anchor="middle" font-weight="bold">VALVE SHUT</text>
<text x="301.33" y="131.96" font-size="1.1" style="fill:#555555" text-anchor="middle">GPIO 24: M42 P42 S0</text>
<text x="301.33" y="37.67" font-size="1.8" style="fill:#555555" text-anchor="middle" font-weight="bold">FUTURE</text>
<text x="274" y="145.67" font-size="1.35" style="fill:#555555">A physical alternative to the touch screen, for gloved or</text>
<text x="274" y="147.67" font-size="1.35" style="fill:#555555">dirty hands. rmr_bridge.py already maps buttons to G-code</text>
<text x="274" y="149.67" font-size="1.35" style="fill:#555555">(pi-panel/rmr_io.example.json); none is wired or bought.</text>
<text x="274" y="151.67" font-size="1.35" style="fill:#555555">The red and green 22 mm buttons on hand could serve.</text>
<text x="14" y="182" font-size="2.1" font-weight="bold">Behind the panel</text>
<text x="14" y="185.4" font-size="1.3" style="fill:#555555">control</text>
<text x="44" y="185.4" font-size="1.3" style="fill:#555555">contact</text>
<text x="72" y="185.4" font-size="1.3" style="fill:#555555">lands on</text>
<text x="132" y="185.4" font-size="1.3" style="fill:#555555">cable (by)</text>
<text x="14" y="188.2" font-size="1.3" font-weight="bold">S1 power knob</text>
<text x="44" y="188.2" font-size="1.3">NO, 110 V</text>
<text x="72" y="188.2" font-size="1.3">X1 1 in, X1 2 out</text>
<text x="132" y="188.2" font-size="1.3">110 V door cable (M20 gland)</text>
<text x="14" y="190.35" font-size="1.3" font-weight="bold">H1 lamp, in S1</text>
<text x="44" y="190.35" font-size="1.3">110 V</text>
<text x="72" y="190.35" font-size="1.3">X1 2 and X1 3 (N)</text>
<text x="132" y="190.35" font-size="1.3">110 V door cable</text>
<text x="14" y="192.5" font-size="1.3" font-weight="bold">panel PE</text>
<text x="44" y="192.5" font-size="1.3"></text>
<text x="72" y="192.5" font-size="1.3">PE 3</text>
<text x="132" y="192.5" font-size="1.3">110 V door cable</text>
<text x="14" y="194.65" font-size="1.3" font-weight="bold">S2 E-stop</text>
<text x="44" y="194.65" font-size="1.3">NC1</text>
<text x="72" y="194.65" font-size="1.3">X2 1 (+24 V), X2 2 (node X)</text>
<text x="132" y="194.65" font-size="1.3">E-stop loop (LL, slot 3)</text>
<text x="14" y="196.8" font-size="1.3" font-weight="bold">S2 E-stop</text>
<text x="44" y="196.8" font-size="1.3">NC2</text>
<text x="72" y="196.8" font-size="1.3">Pi GPIO 20 and GND, 1 k to 3V3</text>
<text x="132" y="196.8" font-size="1.3">at the panel</text>
<text x="14" y="198.95" font-size="1.3" font-weight="bold">S3 Reset</text>
<text x="44" y="198.95" font-size="1.3">NO</text>
<text x="72" y="198.95" font-size="1.3">X2 2 (node X) to X2 3 (node Y)</text>
<text x="132" y="198.95" font-size="1.3">E-stop loop (LL, slot 3)</text>
<text x="14" y="201.1" font-size="1.3" font-weight="bold">touch screen</text>
<text x="44" y="201.1" font-size="1.3">HDMI, USB</text>
<text x="72" y="201.1" font-size="1.3">Pi 5</text>
<text x="132" y="201.1" font-size="1.3">at the panel</text>
<text x="14" y="203.25" font-size="1.3" font-weight="bold">Pi 5</text>
<text x="44" y="203.25" font-size="1.3">5 V in</text>
<text x="72" y="203.25" font-size="1.3">5 V PSU (F1-2)</text>
<text x="132" y="203.25" font-size="1.3">5 V feed (LL)</text>
<text x="14" y="205.4" font-size="1.3" font-weight="bold">Pi 5</text>
<text x="44" y="205.4" font-size="1.3">USB</text>
<text x="72" y="205.4" font-size="1.3">Mega</text>
<text x="132" y="205.4" font-size="1.3">USB cable (UF)</text>
<text x="14" y="207.55" font-size="1.3" font-weight="bold">Pi 5</text>
<text x="44" y="207.55" font-size="1.3">GPIO 5, 6, 13, 26</text>
<text x="72" y="207.55" font-size="1.3">tower SSRs (GND to their inputs -)</text>
<text x="132" y="207.55" font-size="1.3">tower inputs (UF)</text>
<text x="258" y="190.6" font-size="3" font-weight="bold">RMR control panel: operator panel</text>
<text x="258" y="194.4" font-size="2">Sheet 2D (2A, 2B: the decks; 2C: names). Legal 14 x 8.5 in, 100 %.</text>
<text x="258" y="197.15" font-size="2">Robot-MakingRobot, docs/wiring. Drawn 2026-10-20 (issue #171).</text>
<text x="258" y="199.9" font-size="2">Status: concept; housing and sizes not designed yet.</text>
<text x="258" y="202.65" font-size="2">Circuits: sheet 1. Terminals: sheet 2C.</text>
</svg>
